# Study design. Human-owned: the agent never edits this file.
# Changing data/ or sampling/ means a new study: rerun `python prepare.py --force`.
# Static susceptibility (one map). Spatial sampling after Moreno et al. (2025, JGR-ES,
# doi:10.1029/2024JF008219) and Moreno et al. (2024, STOTEN 912:169166).

data:
  dem: data/grids/dem.tif                  # reference grid: projected CRS in metres; map resolution
  events: data/points_landslide.geojson    # ALL recorded events of one process (dates not needed)
  landcover:                               # Corine Land Cover level-3 codes: the standard mask
    path: data/vectors/CorineLandCover_polygon.tif
    crs: EPSG:25832                        # this file lacks complete CRS metadata

sampling:
  seed: 42
  # Trivial terrain removed for BOTH classes and from the map (Moreno 2025: rock faces,
  # glaciers, water bodies). CLC 332 bare rocks, 335 glaciers/perpetual snow,
  # 511 water courses, 512 water bodies.
  mask_landcover: [332, 335, 511, 512]
  flat_slope_deg: null         # optional extra rule: cells flatter than this are trivial (paper: "flat lands")
  survey_mask: null            # optional raster, 1 = effectively surveyed area (Moreno 2025 ESA)
  absence_ratio: 10            # absences per presence cell (JGR-ES final sample ~1:10)
  buffer_m: 150                # no absence within 150 m of any inventoried event (JGR-ES)

evaluation:
  folds: 10                    # k-means spatial CV on coordinates (sperrorest partition_kmeans)

limits:
  artifacts_gb: 40             # everything generated (artifacts/) must stay below this
  file_gb: 2                   # largest single file a SAGA command may write
  saga_timeout_s: 900          # per SAGA command
  cpus: 4                      # saga_cmd --cores and model n_jobs
